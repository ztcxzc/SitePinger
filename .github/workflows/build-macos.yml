name: Build macOS

# Packages the Electron app for macOS on a macOS runner.
#
# Unsigned and un-notarised: signing needs an Apple Developer certificate.
# macOS will refuse to open it on first launch, and the user has to allow it
# once under System Settings > Privacy & Security. That is expected for a
# self-distributed build, not a bug.
#
# macOS runners bill at 10x the Linux rate against free minutes on private
# repositories, so this only runs when asked or when a tag is pushed.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Run the app's own build first when it has one.
      #
      # electron-builder packages whatever is on disk; it does not run your
      # build script. An app whose index.html loads a bundled dist/bundle.js
      # therefore ships without it and opens to a blank window that closes
      # immediately. Skipped when the build script is really the packager.
      - name: Build the renderer
        run: |
          set -e
          SCRIPT=$(node -e "process.stdout.write((require('./package.json').scripts||{}).build||'')")
          if [ -n "$SCRIPT" ] && ! echo "$SCRIPT" | grep -q 'electron-builder'; then
            echo "running build: $SCRIPT"
            npm run build
          else
            echo "no separate renderer build step; skipping"
          fi

      # Target zip rather than the default dmg.
      #
      # dmg-builder needs a background image that projects often reference but
      # never commit, and it fails hard when the file is missing. A zip holding
      # the .app is just as installable — drag it to Applications — and has no
      # such dependency. dmg is then attempted separately, best-effort.
      - name: Build the app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # do not hunt for a signing identity
        run: npx electron-builder --mac zip --arm64 --x64 --publish never

      - name: Also try a dmg (optional)
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never -c.dmg.background=null

      - name: Show what was produced
        run: ls -lh dist/*.dmg dist/*.zip 2>/dev/null || ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
