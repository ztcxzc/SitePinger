name: Build macOS

# Packages the Electron app for macOS on a macOS runner.
#
# Unsigned and un-notarised: signing needs an Apple Developer certificate.
# macOS will refuse to open it on first launch, and the user has to allow it
# once under System Settings > Privacy & Security. That is expected for a
# self-distributed build, not a bug.
#
# macOS runners bill at 10x the Linux rate against free minutes on private
# repositories, so this only runs when asked or when a tag is pushed.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Build both architectures: arm64 for Apple silicon, x64 for older Intel
      # Macs. electron-builder emits a separate dmg for each.
      - name: Build the app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # do not hunt for a signing identity
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Show what was produced
        run: ls -lh dist/*.dmg dist/*.zip 2>/dev/null || ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
